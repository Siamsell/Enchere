<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Annonce with Media Upload</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 1rem;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      margin-top: 5px;
      padding: 8px;
      font-size: 14px;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      font-family: monospace;
      color: green;
    }
  </style>
</head>
<body>

  <h2>Créer une Annonce + Uploader Images/Vidéos</h2>

  <form id="uploadForm" enctype="multipart/form-data">
    <label for="telephone">Téléphone:</label>
    <input type="text" name="telephone" required>

    <label for="prix">Prix:</label>
    <input type="text" name="prix" required>

    <label for="wilaya">Wilaya:</label>
    <input type="text" name="wilaya">

    <label for="commune">Commune:</label>
    <input type="text" name="commune">

    <label for="place_verification">Lieu de vérification:</label>
    <input type="text" name="place_verification">

    <label for="place_vendre">Lieu de vente:</label>
    <input type="text" name="place_vendre">

    <label for="date_debut">Date de début:</label>
    <input type="datetime-local" name="date_debut">

    <label for="date_fin">Date de fin:</label>
    <input type="datetime-local" name="date_fin">

    <label for="medias">Images / Vidéos:</label>
    <input type="file" name="medias" accept="image/*,video/*" multiple required>

    <button type="submit">Créer l'annonce</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const res = await fetch('https://enchere-dz.com/annonces/create', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          result.style.color = 'green';
          result.innerText = '✅ Annonce créée:\n' + JSON.stringify(data, null, 2);
        } else {
          result.style.color = 'red';
          result.innerText = '❌ Erreur:\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        result.style.color = 'red';
        result.innerText = '❌ Échec de la requête:\n' + err.message;
      }
    });
  </script>

</body>
</html>
