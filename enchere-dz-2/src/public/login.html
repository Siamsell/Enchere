    }

    .form-control {
        width: 100%;

        border-radius: 8px;
        font-size: 1rem;

    .form-control:focus {
        border-color: var(--primary-color);

    }

    /* Style moderne pour la checkbox */
    .terms-container {
        margin: 1.5rem 0 2rem;
        padding: 1rem;
        background-color: #f8f9fa;
        border-radius: 8px;
        border: 1px solid #e9ecef;
    }

    .checkbox-wrapper {
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }

    #termsCheckbox {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #ddd;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 3px;
        transition: all 0.2s ease;
        position: relative;
    }

    #termsCheckbox:checked {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
    }

    #termsCheckbox:checked::after {
        content: '✓';
        position: absolute;
        color: white;
        font-size: 14px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    .checkbox-label {
        font-size: 0.9rem;
        color: var(--text-color);
        line-height: 1.5;
    }

    .checkbox-label a {
        color: var(--primary-color);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .checkbox-label a:hover {
        color: var(--accent-color);
        text-decoration: underline;
    }

    /* Bouton de soumission */
    .submit-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(56, 84, 56, 0.2);
        position: relative;
        overflow: hidden;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(56, 84, 56, 0.3);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .submit-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: 0.5s;
    }

    .submit-btn:hover::after {
        left: 100%;
    }
    .menu-item a {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 15px;

    /* Lien d'inscription */

    /* Animation pour les champs */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .terms-container { animation: fadeIn 0.4s ease 0.3s forwards; }
    .submit-btn { animation: fadeIn 0.4s ease 0.4s forwards; }
    .auth-footer { animation: fadeIn 0.4s ease 0.5s forwards; }
</style>
  
</head>
